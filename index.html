  <!-- Lock / first-run -->
  <section id="lock" class="lock" hidden>
    <div class="lock-orbit" aria-hidden="true">
      <span class="orb orb-a"><svg><use href="#i-pie"/></svg></span>
      <span class="orb orb-main"><svg><use href="#i-logo"/></svg></span>
      <span class="orb orb-b"><svg><use href="#i-wallet"/></svg></span>
    </div>
    <h1 class="lock-title">Spendly</h1>
    <p class="lock-sub">Smart money, smarter life</p>
    <form id="lock-form" class="lock-card" novalidate>
      <label class="field">
        <span id="lock-label">Password</span>
        <div class="input-icon">
          <svg><use href="#i-lock"/></svg>
          <input type="password" id="lock-password" autocomplete="current-password" required minlength="8" />
          <button type="button" class="ghost-icon" id="lock-peek" aria-label="Show password"><svg><use href="#i-eye"/></svg></button>
        </div>
      </label>
      <label class="field" id="lock-confirm-wrap" hidden>
        <span>Confirm password</span>
        <div class="input-icon">
          <svg><use href="#i-lock"/></svg>
          <input type="password" id="lock-confirm" autocomplete="new-password" minlength="8" />
        </div>
      </label>
      <p id="lock-error" class="form-error" role="alert"></p>
      <button class="btn btn-primary btn-block" type="submit" id="lock-submit">Unlock</button>
      <p id="lock-note" class="lock-note" hidden>Your data is encrypted with this password and stays on this device. If you forget it, the data cannot be recovered — download a backup from Settings from time to time.</p>
      <button type="button" class="link-btn" id="lock-reset" hidden>Forgot password?</button>
    </form>
  </section>

  <!-- App -->
  <div id="shell" class="shell" hidden>
    <aside class="sidebar">
      <a class="brand" href="#dashboard"><span class="brand-mark"><svg><use href="#i-logo"/></svg></span>Spendly</a>
      <nav class="nav" id="side-nav" aria-label="Sections"></nav>
      <div class="side-actions">
        <a class="btn btn-primary btn-block" href="#quick"><svg><use href="#i-zap"/></svg>Quick Add</a>
        <button class="btn btn-ghost btn-block" data-act="add-asset"><svg><use href="#i-plus"/></svg>Add Asset</button>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <a class="brand brand-mobile" href="#dashboard"><span class="brand-mark"><svg><use href="#i-logo"/></svg></span>Spendly</a>
        <div class="topbar-title" id="topbar-title"></div>
        <div class="topbar-actions">
          <button class="icon-btn" id="privacy-toggle" data-act="toggle-privacy" aria-pressed="false" aria-label="Show amounts" title="Show amounts">
            <svg><use href="#i-eye-off"/></svg>
          </button>
          <button class="icon-btn" data-act="lock" aria-label="Lock Spendly" title="Lock"><svg><use href="#i-lock"/></svg></button>
        </div>
      </header>
      <main id="view" class="view" tabindex="-1"></main>
    </div>

    <nav class="tabbar" aria-label="Main">
      <a href="#dashboard" data-tab="dashboard"><svg><use href="#i-home"/></svg><span>Home</span></a>
      <a href="#transactions" data-tab="transactions"><svg><use href="#i-list"/></svg><span>Activity</span></a>
      <a href="#quick" class="tab-fab" data-tab="quick" aria-label="Quick Add"><svg><use href="#i-plus"/></svg></a>
      <a href="#assets" data-tab="assets"><svg><use href="#i-pie"/></svg><span>Assets</span></a>
      <button data-act="more" data-tab="more"><svg><use href="#i-more"/></svg><span>More</span></button>
    </nav>
  </div>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-inner">
      <div class="sheet-head">
        <h2 id="sheet-title"></h2>
        <button type="button" class="icon-btn" data-act="close-sheet" aria-label="Close"><svg><use href="#i-x"/></svg></button>
      </div>
      <div id="sheet-body"></div>
    </div>
  </dialog>

  <dialog id="ask" class="ask" aria-labelledby="ask-title">
    <form method="dialog">
      <h2 id="ask-title"></h2>
      <p id="ask-message"></p>
      <label class="field" id="ask-type-wrap" hidden><span>Type <b id="ask-word"></b> to confirm</span><input id="ask-input" autocomplete="off" /></label>
      <div class="row-end">
        <button class="btn btn-ghost" value="cancel">Cancel</button>
        <button class="btn btn-primary" value="ok" id="ask-ok">OK</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/ui/app.js"></script>
</body>
